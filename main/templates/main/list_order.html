{% extends 'main/base.html' %}


{% block title %}
    List order
{% endblock title %}


{% block content %}
    
    
    {% for order in orders %}
        <div>
            <h3>{{ order.services.title }}</h3>
            <p>{{ order.status }}</p>
            <p>{{ order.scheduledd_at }}</p>
        </div>
    {% empty %}
        <p>Пока пусто</p>
    {% endfor %}
        

{% endblock content %}
