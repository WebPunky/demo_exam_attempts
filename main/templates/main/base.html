<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    {% block title %}
        Главная
    {% endblock title %}
        </title>
</head>
<body>  
    <header>
        <div>
            <img src="" alt="">
            <p><a href="{% url 'hero' %}">Лыжня</a></p>
        </div>
        <div>
            
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Профиль</a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'register' %}">Регистрация</a>
                <a href="{% url 'login' %}">Логин</a>
            {% endif %}
                
        </div>
    </header>

    <main>
        
        {% block content %}
            
        {% endblock content %}
            
    </main>

    <footer>
        <p>Made by WebPunky</p>
    </footer>
</body>
</html>
